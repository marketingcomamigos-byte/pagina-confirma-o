<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação - iStart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #081B2C;
            padding: 20px;
        }
        .container {
            background: #102F45;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #21465E;
        }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        .success { color: #18B981; }
        .error { color: #E53E3E; }
        .warning { color: #F59E0B; }
        .loading { color: #00B8D9; }
        .text-primary { color: #F5F9FC; }
        .text-secondary { color: #91A4B3; }
        .text-muted { color: #6A8BA0; }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #00B8D9;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            box-sizing: border-box;
            transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-success { background: #18B981; }
        .btn-success:hover { background: #0D9668; }
        .btn-gray { background: #6A8BA0; }
        .btn-gray:hover { background: #4A6B80; }
        .btn-whatsapp { background: #25D366; }
        .btn-whatsapp:hover { background: #1da851; }
        .btn-danger { background: #E53E3E; }
        .btn-danger:hover { background: #C53030; }
        
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #21465E;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            background: #1A3D55;
            color: #F5F9FC;
        }
        input[type="email"]::placeholder {
            color: #6A8BA0;
        }
        input[type="email"]:focus {
            border-color: #00B8D9;
            outline: none;
        }
        input[type="email"].error-input {
            border-color: #E53E3E;
            background: #2A1A1A;
        }
        
        .detalhes-box {
            background: #081B2C;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.8rem;
            color: #6A8BA0;
            text-align: left;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #21465E;
        }
        .detalhes-box strong { color: #91A4B3; }
        
        .spinner {
            border: 4px solid #21465E;
            border-top: 4px solid #00B8D9;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .mt-8 { margin-top: 8px; }
        .mt-16 { margin-top: 16px; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .gap-8 { gap: 8px; }
        .text-sm { font-size: 0.85rem; color: #91A4B3; }
        .text-error { color: #E53E3E; font-size: 0.85rem; }
        .hidden { display: none; }
        
        .tentativas-box {
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }
        .tentativas-box .contador {
            font-weight: 700;
            color: #F59E0B;
        }
        
        .conta-info {
            background: rgba(0,184,217,0.1);
            padding: 16px;
            border-radius: 8px;
            margin: 8px 0;
            text-align: left;
            border: 1px solid rgba(0,184,217,0.2);
        }
        .conta-info p {
            margin: 4px 0;
            color: #F5F9FC;
        }
        .conta-info strong {
            color: #00B8D9;
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: #00B8D9;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .logo-subtitle {
            color: #91A4B3;
            margin-bottom: 25px;
            font-size: 0.9rem;
            font-weight: 400;
        }
        h1 { color: #F5F9FC; }
        p { color: #F5F9FC; }
    </style>
</head>
<body>
    <div class="container" id="statusContainer">
        <!-- O JavaScript vai preencher aqui -->
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÕES
        // ============================================================
        const SUPABASE_URL = 'https://rprocjpzydkondrguzui.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcm9janB6eWRrb25kcmd1enVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM2ODA2NjIsImV4cCI6MjA3OTI1NjY2Mn0.bD36ix62EYFdnnTKXN3iK9C9AoOeKyWGkY10D-A1tm0';
        const SISTEMA_URL = 'https://istart-nova.vercel.app';
        const WHATSAPP_NUMERO = '5544997311635';
        const MAX_TENTATIVAS = 3;

        // ============================================================
        // PEGAR PARÂMETROS DA URL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const params = {};
        for (const [key, value] of urlParams.entries()) {
            params[key] = value;
        }

        console.log('📥 Parâmetros recebidos:', params);

        const preapprovalId = params.preapproval_id || params.pref_id;
        const status = params.status || params.collection_status;
        const externalReference = params.external_reference;
        const collectionId = params.collection_id || params.payment_id;

        // ============================================================
        // ESTADO
        // ============================================================
        let tentativas = 0;
        let emailAtual = '';

        // ============================================================
        // REFERÊNCIA AO CONTAINER
        // ============================================================
        const container = document.getElementById('statusContainer');

        // ============================================================
        // FUNÇÕES DE RENDERIZAÇÃO
        // ============================================================
        function renderizar(icon, titulo, classe, mensagem, botoes, detalhes) {
            container.innerHTML = `
                <div class="logo"><i class="fas fa-chart-line"></i> iStart</div>
                <div class="logo-subtitle">Confirmação de Ativação Premium</div>
                <div class="icon">${icon}</div>
                <h1 class="${classe}">${titulo}</h1>
                <p style="margin: 8px 0 16px; color: #F5F9FC;">${mensagem}</p>
                ${detalhes || ''}
                <div class="flex flex-col gap-8 mt-16">
                    ${botoes || ''}
                </div>
            `;
        }

        function mostrarCarregando() {
            renderizar(
                '⏳',
                'Processando...',
                'loading',
                'Aguarde enquanto ativamos seu premium.',
                '',
                `<div class="spinner"></div>`
            );
        }

        function mostrarSucesso(email) {
            renderizar(
                '🎉',
                'Premium Ativado com Sucesso!',
                'success',
                `Agora você tem acesso a todas as funcionalidades premium do iStart.`,
                `
                    <a href="${SISTEMA_URL}" class="btn btn-success">🚀 Ir para o Sistema</a>
                `,
                `<p class="text-sm">✅ Email: ${email}</p>`
            );
        }

        function mostrarContaJaAtivada(conta) {
            const dataFormatada = conta.ativado_em 
                ? new Date(conta.ativado_em).toLocaleDateString('pt-BR') 
                : 'Data desconhecida';

            renderizar(
                '🔒',
                'Este código já foi utilizado!',
                'warning',
                `Este código de pagamento já foi usado para ativar uma conta.`,
                `
                    <div class="conta-info">
                        <p><strong>📧 Conta ativada:</strong> ${conta.email}</p>
                        <p><strong>📅 Data:</strong> ${dataFormatada}</p>
                        <p style="font-size: 0.8rem; color: #6A8BA0; margin-top: 4px;">Cada código de pagamento só pode ser usado uma vez.</p>
                    </div>
                    <a href="${SISTEMA_URL}" class="btn btn-gray">🔙 Voltar para o Sistema</a>
                `,
                `<p class="text-sm">Se você não reconhece esta conta, entre em contato com o suporte.</p>`
            );
        }

        function mostrarCampoEmail(mensagemErro) {
            const tentativasRestantes = MAX_TENTATIVAS - tentativas;
            const podeTentar = tentativas < MAX_TENTATIVAS;

            let html = `
                <div class="icon">📧</div>
                <h1 class="${podeTentar ? 'loading' : 'error'}">${podeTentar ? 'Precisamos do seu email' : 'Não foi possível ativar'}</h1>
                <p style="margin: 8px 0 16px; color: #F5F9FC;">
                    ${podeTentar 
                        ? 'Para ativar seu premium, informe o email cadastrado no iStart:' 
                        : 'Você atingiu o limite de tentativas. Entre em contato com o suporte.'}
                </p>
            `;

            if (mensagemErro) {
                html += `<p class="text-error">${mensagemErro}</p>`;
            }

            if (podeTentar) {
                html += `
                    <div class="tentativas-box">
                        <span class="contador">${tentativasRestantes}</span> <span style="color: #F5F9FC;">tentativa(s) restante(s)</span>
                    </div>
                    <input type="email" id="emailInput" placeholder="seu@email.com" value="${emailAtual}">
                    <button onclick="ativarComEmail()" class="btn btn-success mt-8">✅ Ativar Premium</button>
                    <p class="text-sm mt-8">Seu email está seguro. Usamos apenas para ativar sua conta.</p>
                `;
            } else {
                html += `
                    <div class="tentativas-box" style="background: rgba(229,62,62,0.1); border-color: rgba(229,62,62,0.3);">
                        <p style="color: #E53E3E; font-weight: 600;">⚠️ Limite de tentativas excedido</p>
                        <p style="font-size: 0.85rem; margin-top: 4px; color: #F5F9FC;">Entre em contato com o suporte para ativar manualmente.</p>
                    </div>
                    <a href="https://wa.me/${WHATSAPP_NUMERO}?text=Olá! Tentei ativar meu premium mas não consegui. Meu email é: ${emailAtual || 'não informado'}" 
                       class="btn btn-whatsapp mt-8">📱 Falar com Suporte</a>
                    <a href="${SISTEMA_URL}" class="btn btn-gray mt-8">Voltar para o Sistema</a>
                `;
            }

            html += `
                <div class="detalhes-box mt-8">
                    <strong>Parâmetros recebidos:</strong><br>
                    ${Object.entries(params).map(([k,v]) => `<strong>${k}:</strong> ${v}`).join('<br>') || 'Nenhum parâmetro'}
                </div>
            `;

            container.innerHTML = html;

            const input = document.getElementById('emailInput');
            if (input) {
                input.focus();
                if (input.value) {
                    input.select();
                }
            }

            window.ativarComEmail = async function() {
                const emailInput = document.getElementById('emailInput');
                const email = emailInput.value.trim();

                if (!email) {
                    mostrarCampoEmail('Por favor, digite seu email.');
                    return;
                }

                if (!email.includes('@') || !email.includes('.')) {
                    mostrarCampoEmail('Digite um email válido (ex: nome@dominio.com)');
                    return;
                }

                tentativas++;
                emailAtual = email;

                mostrarCarregando();

                try {
                    const result = await ativarPremium(email);
                    if (result.success) {
                        if (result.already_activated) {
                            mostrarContaJaAtivada(result.conta);
                        } else {
                            mostrarSucesso(email);
                        }
                    } else {
                        mostrarCampoEmail(result.error || 'Email não encontrado. Tente novamente.');
                    }
                } catch (error) {
                    mostrarCampoEmail('Erro ao conectar. Tente novamente.');
                }
            };

            const inputEl = document.getElementById('emailInput');
            if (inputEl) {
                inputEl.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        window.ativarComEmail();
                    }
                });
            }
        }

        // ============================================================
        // FUNÇÃO PARA ATIVAR PREMIUM (CHAMANDO A EDGE FUNCTION)
        // ============================================================
        async function ativarPremium(email) {
            try {
                // 🔥 CHAMAR A EDGE FUNCTION (como fizemos no teste)
                const response = await fetch(
                    `${SUPABASE_URL}/functions/v1/ativar-premium`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            preapproval_id: preapprovalId,
                            email: email,
                            external_reference: externalReference || email,
                            collection_id: collectionId || null
                        })
                    }
                );

                const result = await response.json();

                // Verificar se a Edge Function retornou sucesso
                if (response.status === 200 && result.success) {
                    // Se o usuário já era premium
                    if (result.already_active) {
                        return { 
                            success: true, 
                            already_activated: true,
                            conta: {
                                email: email,
                                ativado_em: new Date().toISOString()
                            }
                        };
                    }
                    return { success: true };
                }

                // Se a Edge Function retornou erro, tratar
                if (result.error) {
                    return { success: false, error: result.error };
                }

                // Se a Edge Function retornou pending (ativação pendente)
                if (result.pending) {
                    return { 
                        success: false, 
                        error: 'ID validado, mas usuário não encontrado. Entre em contato com o suporte.'
                    };
                }

                return { success: false, error: 'Erro ao ativar premium' };

            } catch (error) {
                console.error('❌ Erro ao ativar premium:', error);
                return { success: false, error: error.message };
            }
        }

        // ============================================================
        // PROCESSAR O RETORNO
        // ============================================================
        function processarPagamento() {
            if (Object.keys(params).length === 0) {
                renderizar(
                    '🤔',
                    'Nenhum parâmetro recebido',
                    'error',
                    'Você pode ter acessado esta página diretamente.',
                    `
                        <a href="${SISTEMA_URL}" class="btn btn-gray">🔙 Voltar para o Sistema</a>
                    `,
                    ''
                );
                return;
            }

            // Se tem preapproval_id, mostrar campo de email
            if (preapprovalId) {
                // Verificar se já foi ativado
                mostrarCampoEmail();
            } else {
                renderizar(
                    '❌',
                    'Código não encontrado',
                    'error',
                    'Nenhum ID de assinatura foi encontrado.',
                    `
                        <a href="https://wa.me/${WHATSAPP_NUMERO}?text=Olá! Tentei ativar meu premium mas não consegui." 
                           class="btn btn-whatsapp">📱 Falar com Suporte</a>
                        <a href="${SISTEMA_URL}" class="btn btn-gray">Voltar para o Sistema</a>
                    `,
                    `<div class="detalhes-box"><strong>Parâmetros recebidos:</strong><br>${Object.entries(params).map(([k,v]) => `<strong>${k}:</strong> ${v}`).join('<br>') || 'Nenhum'}</div>`
                );
            }
        }

        // ============================================================
        // INICIAR
        // ============================================================
        mostrarCarregando();
        setTimeout(processarPagamento, 1500);
    </script>
</body>
</html>
