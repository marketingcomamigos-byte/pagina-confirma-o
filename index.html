<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação - iStart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f7fa;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .loading { color: #1a2a6c; }
        .success { color: #2e7d32; }
        .error { color: #c62828; }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #1a2a6c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 16px;
            border: none;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }
        .btn-whatsapp { background: #25D366; }
        .btn-whatsapp:hover { background: #1da851; }
        .btn-gray { background: #6b7280; }
        .btn-gray:hover { background: #4b5563; }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 8px;
            box-sizing: border-box;
        }
        input[type="email"]:focus {
            border-color: #1a2a6c;
            outline: none;
        }
        .detalhes-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.8rem;
            color: #6b7280;
            text-align: left;
            word-break: break-all;
        }
        .hidden { display: none; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a2a6c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="statusContainer">
        <!-- Estados serão inseridos pelo JavaScript -->
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÕES
        // ============================================================
        const SUPABASE_URL = 'https://rprocjpzydkondrguzui.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcm9janB6eWRrb25kcmd1enVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM2ODA2NjIsImV4cCI6MjA3OTI1NjY2Mn0.bD36ix62EYFdnnTKXN3iK9C9AoOeKyWGkY10D-A1tm0';
        
        // ✅ URL DO SEU SISTEMA (CORRIGIDA)
        const SISTEMA_URL = 'https://istart-nova.vercel.app';
        const WHATSAPP_NUMERO = '5544997311635';

        // ============================================================
        // PEGAR TODOS OS PARÂMETROS DA URL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        
        // Mapear todos os parâmetros possíveis
        const params = {};
        for (const [key, value] of urlParams.entries()) {
            params[key] = value;
        }

        console.log('📥 Todos os parâmetros recebidos:', params);

        // Parâmetros do Mercado Pago
        const collectionId = params.collection_id || params.payment_id;
        const collectionStatus = params.collection_status || params.status;
        const preapprovalId = params.preapproval_id;
        const externalReference = params.external_reference;
        const merchantOrderId = params.merchant_order_id;

        // ============================================================
        // REFERÊNCIA AO CONTAINER
        // ============================================================
        const container = document.getElementById('statusContainer');

        // ============================================================
        // FUNÇÃO PARA RENDERIZAR ESTADO
        // ============================================================
        function renderizarEstado(icon, titulo, mensagem, botoes, detalhesExtra) {
            container.innerHTML = `
                <div class="icon">${icon}</div>
                <h1 class="${titulo.includes('Sucesso') ? 'success' : titulo.includes('Erro') ? 'error' : 'loading'}">${titulo}</h1>
                <p>${mensagem}</p>
                ${detalhesExtra || ''}
                <div style="margin-top: 16px;">
                    ${botoes}
                </div>
            `;
        }

        // ============================================================
        // FUNÇÃO PARA MOSTRAR CARREGANDO
        // ============================================================
        function mostrarCarregando() {
            container.innerHTML = `
                <div class="spinner"></div>
                <h1 class="loading">Processando seu pagamento...</h1>
                <p>Aguarde enquanto confirmamos sua assinatura.</p>
            `;
        }

        // ============================================================
        // FUNÇÃO PARA MOSTRAR ERRO
        // ============================================================
        function mostrarErro(mensagemErro, email) {
            renderizarEstado(
                '❌',
                'Erro ao ativar premium',
                mensagemErro,
                `
                    <a href="https://wa.me/${WHATSAPP_NUMERO}?text=Olá! Tive um problema ao ativar meu premium. Meu email é: ${email || 'não informado'}" 
                       class="btn btn-whatsapp" style="display: inline-block; width: 100%; box-sizing: border-box;">
                        📱 Falar com Suporte
                    </a>
                    <br>
                    <a href="${SISTEMA_URL}" class="btn btn-gray" style="display: inline-block; width: 100%; box-sizing: border-box; margin-top: 8px;">
                        Voltar para o Sistema
                    </a>
                `,
                `<div class="detalhes-box"><strong>Parâmetros recebidos:</strong><br>${Object.entries(params).map(([k,v]) => `<strong>${k}:</strong> ${v}`).join('<br>') || 'Nenhum parâmetro'}</div>`
            );
        }

        // ============================================================
        // FUNÇÃO PARA MOSTRAR SUCESSO
        // ============================================================
        function mostrarSucesso(email) {
            renderizarEstado(
                '✅',
                'Premium Ativado com Sucesso! 🎉',
                `Agora você tem acesso a todas as funcionalidades premium do iStart.`,
                `
                    <a href="${SISTEMA_URL}" class="btn" style="display: inline-block; width: 100%; box-sizing: border-box;">
                        🚀 Ir para o Sistema
                    </a>
                `,
                `<p style="font-size: 0.9rem; color: #6b7280; margin-top: 8px;">Email: ${email}</p>`
            );
        }

        // ============================================================
        // FUNÇÃO PARA MOSTRAR STATUS DESCONHECIDO
        // ============================================================
        function mostrarStatusDesconhecido() {
            renderizarEstado(
                '🤔',
                'Status do pagamento: desconhecido',
                'Não foi possível identificar o status do seu pagamento.',
                `
                    <a href="https://wa.me/${WHATSAPP_NUMERO}?text=Olá! Fiz o pagamento mas o sistema não reconheceu." 
                       class="btn btn-whatsapp" style="display: inline-block; width: 100%; box-sizing: border-box;">
                        📱 Falar com Suporte
                    </a>
                    <br>
                    <a href="${SISTEMA_URL}" class="btn btn-gray" style="display: inline-block; width: 100%; box-sizing: border-box; margin-top: 8px;">
                        Voltar para o Sistema
                    </a>
                `,
                `<div class="detalhes-box"><strong>Parâmetros recebidos:</strong><br>${Object.entries(params).map(([k,v]) => `<strong>${k}:</strong> ${v}`).join('<br>') || 'Nenhum parâmetro recebido'}</div>`
            );
        }

        // ============================================================
        // FUNÇÃO PARA MOSTRAR CAMPO DE EMAIL
        // ============================================================
        function mostrarCampoEmail() {
            container.innerHTML = `
                <div class="icon">📧</div>
                <h1>Precisamos do seu email</h1>
                <p>Para ativar seu premium, informe o email cadastrado no iStart:</p>
                <input type="email" id="emailInput" placeholder="seu@email.com">
                <button onclick="ativarComEmail()" class="btn" style="width: 100%; margin-top: 12px; cursor: pointer;">
                    ✅ Ativar Premium
                </button>
                <p style="font-size: 0.8rem; color: #6b7280; margin-top: 8px;">
                    Seu email está seguro. Usamos apenas para ativar sua conta.
                </p>
                <div class="detalhes-box"><strong>Parâmetros recebidos:</strong><br>${Object.entries(params).map(([k,v]) => `<strong>${k}:</strong> ${v}`).join('<br>') || 'Nenhum parâmetro'}</div>
                <a href="${SISTEMA_URL}" class="btn btn-gray" style="display: inline-block; width: 100%; box-sizing: border-box; margin-top: 8px; text-align: center;">
                    Voltar para o Sistema
                </a>
            `;

            // Função global para o botão
            window.ativarComEmail = async function() {
                const emailInput = document.getElementById('emailInput');
                const email = emailInput.value.trim();

                if (!email) {
                    alert('Por favor, digite seu email.');
                    return;
                }

                // Mostrar loading
                container.innerHTML = `
                    <div class="spinner"></div>
                    <h1 class="loading">Ativando seu premium...</h1>
                    <p>Por favor, aguarde.</p>
                `;

                try {
                    const result = await ativarPremium(email, preapprovalId);
                    
                    if (result.success) {
                        mostrarSucesso(email);
                    } else {
                        mostrarErro(result.error || 'Erro ao ativar premium. Entre em contato com o suporte.', email);
                    }

                } catch (error) {
                    console.error('Erro ao ativar premium:', error);
                    mostrarErro('Erro ao ativar premium. Entre em contato com o suporte.', email);
                }
            };
        }

        // ============================================================
        // FUNÇÃO PARA BUSCAR USUÁRIO POR EMAIL
        // ============================================================
        async function buscarUsuarioPorEmail(email) {
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/usuarios?email=eq.${encodeURIComponent(email)}`,
                    {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                if (!response.ok) throw new Error('Usuário não encontrado');
                const usuarios = await response.json();
                return usuarios[0] || null;

            } catch (error) {
                console.error('Erro ao buscar usuário:', error);
                return null;
            }
        }

        // ============================================================
        // ATIVAR PREMIUM
        // ============================================================
        async function ativarPremium(email, preapprovalId) {
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/functions/v1/ativar-premium`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: email,
                            preapproval_id: preapprovalId,
                            external_reference: externalReference,
                            collection_id: collectionId
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Erro ao ativar premium');
                }

                return result;

            } catch (error) {
                console.error('❌ Erro ao ativar premium:', error);
                throw error;
            }
        }

        // ============================================================
        // PROCESSAR O RETORNO DO MERCADO PAGO
        // ============================================================
        async function processarPagamento() {
            // Verificar se há parâmetros
            if (Object.keys(params).length === 0) {
                mostrarStatusDesconhecido();
                return;
            }

            // Verificar o status do pagamento
            const statusPagamento = collectionStatus || params.status;
            
            if (statusPagamento === 'approved' || statusPagamento === 'pending') {
                // Pagamento aprovado ou pendente - tentar ativar
                let email = null;

                // Tentar buscar email de várias formas
                if (externalReference) {
                    try {
                        const usuario = await buscarUsuarioPorEmail(externalReference);
                        if (usuario) {
                            email = usuario.email;
                        }
                    } catch (error) {
                        console.error('Erro ao buscar usuário:', error);
                    }
                }

                if (!email && params.email) {
                    email = params.email;
                }

                if (email) {
                    // Ativar premium
                    mostrarCarregando();
                    
                    try {
                        const result = await ativarPremium(email, preapprovalId);
                        
                        if (result.success) {
                            mostrarSucesso(email);
                        } else {
                            mostrarErro(result.error || 'Erro ao ativar premium. Entre em contato com o suporte.', email);
                        }

                    } catch (error) {
                        console.error('Erro ao ativar premium:', error);
                        mostrarErro('Erro ao ativar premium. Entre em contato com o suporte.', email);
                    }
                } else {
                    // Não encontrou email
                    mostrarCampoEmail();
                }
            } else if (statusPagamento === 'rejected') {
                mostrarErro('Seu pagamento foi recusado. Tente novamente com outro cartão.', null);
            } else {
                // Status desconhecido
                mostrarStatusDesconhecido();
            }
        }

        // ============================================================
        // INICIAR PROCESSAMENTO
        // ============================================================
        // Mostrar loading inicial
        mostrarCarregando();
        
        // Processar após 1 segundo
        setTimeout(processarPagamento, 1000);
    </script>
</body>
</html>
