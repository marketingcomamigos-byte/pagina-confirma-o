<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação - iStart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f7fa;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .loading { color: #1a2a6c; }
        .success { color: #2e7d32; }
        .error { color: #c62828; }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #1a2a6c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 16px;
            border: none;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }
        .btn-whatsapp { background: #25D366; }
        .btn-whatsapp:hover { background: #1da851; }
        .btn-gray { background: #6b7280; }
        .btn-gray:hover { background: #4b5563; }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 8px;
            box-sizing: border-box;
        }
        input[type="email"]:focus {
            border-color: #1a2a6c;
            outline: none;
        }
        .detalhes-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.8rem;
            color: #6b7280;
            text-align: left;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container" id="statusContainer">
        <div class="icon loading">⏳</div>
        <h1 id="titulo" class="loading">Processando seu pagamento...</h1>
        <p id="mensagem">Aguarde enquanto confirmamos sua assinatura.</p>
        <div id="detalhes"></div>
        <div id="botaoContainer"></div>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÕES
        // ============================================================
        const SUPABASE_URL = 'https://rprocjpzydkondrguzui.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcm9janB6eWRrb25kcmd1enVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM2ODA2NjIsImV4cCI6MjA3OTI1NjY2Mn0.bD36ix62EYFdnnTKXN3iK9C9AoOeKyWGkY10D-A1tm0';

        // ============================================================
        // PEGAR TODOS OS PARÂMETROS DA URL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        
        // Mapear todos os parâmetros possíveis
        const params = {};
        for (const [key, value] of urlParams.entries()) {
            params[key] = value;
        }

        console.log('📥 Todos os parâmetros recebidos:', params);

        // Parâmetros do Mercado Pago
        const collectionId = params.collection_id || params.payment_id;
        const collectionStatus = params.collection_status || params.status;
        const preapprovalId = params.preapproval_id;
        const externalReference = params.external_reference;
        const merchantOrderId = params.merchant_order_id;

        // ============================================================
        // ELEMENTOS DA PÁGINA
        // ============================================================
        const container = document.getElementById('statusContainer');
        const titulo = document.getElementById('titulo');
        const mensagem = document.getElementById('mensagem');
        const detalhes = document.getElementById('detalhes');
        const botaoContainer = document.getElementById('botaoContainer');

        // ============================================================
        // MOSTRAR TODOS OS PARÂMETROS PARA DEBUG
        // ============================================================
        function mostrarParametros() {
            const paramsHtml = Object.entries(params)
                .map(([key, value]) => `<strong>${key}:</strong> ${value}`)
                .join('<br>');
            
            detalhes.innerHTML = `
                <div class="detalhes-box">
                    <strong>Parâmetros recebidos:</strong><br>
                    ${paramsHtml || 'Nenhum parâmetro recebido'}
                </div>
            `;
        }

        mostrarParametros();

        // ============================================================
        // FUNÇÃO PARA BUSCAR USUÁRIO POR EMAIL
        // ============================================================
        async function buscarUsuarioPorEmail(email) {
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/usuarios?email=eq.${encodeURIComponent(email)}`,
                    {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                if (!response.ok) throw new Error('Usuário não encontrado');
                const usuarios = await response.json();
                return usuarios[0] || null;

            } catch (error) {
                console.error('Erro ao buscar usuário:', error);
                return null;
            }
        }

        // ============================================================
        // ATIVAR PREMIUM
        // ============================================================
        async function ativarPremium(email, preapprovalId) {
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/functions/v1/ativar-premium`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: email,
                            preapproval_id: preapprovalId,
                            external_reference: externalReference,
                            collection_id: collectionId
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Erro ao ativar premium');
                }

                return result;

            } catch (error) {
                console.error('❌ Erro ao ativar premium:', error);
                throw error;
            }
        }

        // ============================================================
        // FUNÇÃO PARA MOSTRAR ERRO
        // ============================================================
        function mostrarErro(mensagemErro, email) {
            document.querySelector('.icon').className = 'icon error';
            document.querySelector('.icon').textContent = '❌';
            titulo.className = 'error';
            titulo.textContent = 'Erro ao ativar premium';
            mensagem.textContent = mensagemErro;
            botaoContainer.innerHTML = `
                <a href="https://wa.me/5544997311635?text=Olá! Tive um problema ao ativar meu premium. Meu email é: ${email || 'não informado'}" 
                   class="btn btn-whatsapp">
                    📱 Falar com Suporte
                </a>
                <br>
                <a href="https://istart.com.br" class="btn btn-gray" style="margin-top: 8px;">
                    Voltar para o Sistema
                </a>
            `;
        }

        // ============================================================
        // FUNÇÃO PARA MOSTRAR SUCESSO
        // ============================================================
        function mostrarSucesso(email) {
            document.querySelector('.icon').className = 'icon success';
            document.querySelector('.icon').textContent = '✅';
            titulo.className = 'success';
            titulo.textContent = 'Premium Ativado com Sucesso!';
            mensagem.textContent = `Agora você tem acesso a todas as funcionalidades premium do iStart.`;
            botaoContainer.innerHTML = `
                <a href="https://istart.com.br" class="btn">
                    🚀 Ir para o Sistema
                </a>
            `;
        }

        // ============================================================
        // FUNÇÃO PARA MOSTRAR CAMPO DE EMAIL
        // ============================================================
        function mostrarCampoEmail() {
            titulo.textContent = 'Precisamos do seu email';
            mensagem.textContent = 'Para ativar seu premium, informe o email cadastrado no iStart:';
            document.querySelector('.icon').textContent = '📧';
            document.querySelector('.icon').className = 'icon';

            botaoContainer.innerHTML = `
                <input type="email" id="emailInput" placeholder="seu@email.com">
                <button onclick="ativarComEmail()" class="btn" style="width: 100%; margin-top: 12px; cursor: pointer;">
                    ✅ Ativar Premium
                </button>
                <p style="font-size: 0.8rem; color: #6b7280; margin-top: 8px;">
                    Seu email está seguro. Usamos apenas para ativar sua conta.
                </p>
                <a href="https://istart.com.br" class="btn btn-gray" style="margin-top: 8px; width: 100%; text-align: center;">
                    Voltar para o Sistema
                </a>
            `;

            window.ativarComEmail = async function() {
                const emailInput = document.getElementById('emailInput');
                const email = emailInput.value.trim();

                if (!email) {
                    alert('Por favor, digite seu email.');
                    return;
                }

                botaoContainer.innerHTML = '<p>⏳ Ativando premium...</p>';

                try {
                    const result = await ativarPremium(email, preapprovalId);
                    
                    if (result.success) {
                        mostrarSucesso(email);
                    } else {
                        mostrarErro(result.error || 'Erro ao ativar premium. Entre em contato com o suporte.', email);
                    }

                } catch (error) {
                    console.error('Erro ao ativar premium:', error);
                    mostrarErro('Erro ao ativar premium. Entre em contato com o suporte.', email);
                }
            };
        }

        // ============================================================
        // FUNÇÃO PARA MOSTRAR STATUS DESCONHECIDO
        // ============================================================
        function mostrarStatusDesconhecido() {
            titulo.textContent = 'Status do pagamento: desconhecido';
            mensagem.textContent = 'Não foi possível identificar o status do seu pagamento.';
            document.querySelector('.icon').className = 'icon';
            document.querySelector('.icon').textContent = '🤔';
            
            botaoContainer.innerHTML = `
                <a href="https://wa.me/5544997311635?text=Olá! Fiz o pagamento mas o sistema não reconheceu. Meu email é: ${email || 'não informado'}" 
                   class="btn btn-whatsapp">
                    📱 Falar com Suporte
                </a>
                <br>
                <a href="https://istart.com.br" class="btn btn-gray" style="margin-top: 8px;">
                    Voltar para o Sistema
                </a>
            `;
        }

        // ============================================================
        // PROCESSAR O RETORNO DO MERCADO PAGO
        // ============================================================
        async function processarPagamento() {
            // Verificar se há parâmetros
            if (Object.keys(params).length === 0) {
                mostrarStatusDesconhecido();
                return;
            }

            // Verificar o status do pagamento
            const statusPagamento = collectionStatus || params.status;
            
            if (statusPagamento === 'approved' || statusPagamento === 'pending') {
                // Pagamento aprovado ou pendente - tentar ativar
                let email = null;

                // Tentar buscar email de várias formas
                if (externalReference) {
                    try {
                        const usuario = await buscarUsuarioPorEmail(externalReference);
                        if (usuario) {
                            email = usuario.email;
                        }
                    } catch (error) {
                        console.error('Erro ao buscar usuário:', error);
                    }
                }

                if (!email && params.email) {
                    email = params.email;
                }

                if (email) {
                    // Ativar premium
                    try {
                        const result = await ativarPremium(email, preapprovalId);
                        
                        if (result.success) {
                            mostrarSucesso(email);
                        } else {
                            mostrarErro(result.error || 'Erro ao ativar premium. Entre em contato com o suporte.', email);
                        }

                    } catch (error) {
                        console.error('Erro ao ativar premium:', error);
                        mostrarErro('Erro ao ativar premium. Entre em contato com o suporte.', email);
                    }
                } else {
                    // Não encontrou email
                    mostrarCampoEmail();
                }
            } else if (statusPagamento === 'rejected') {
                mostrarErro('Seu pagamento foi recusado. Tente novamente com outro cartão.', null);
            } else {
                // Status desconhecido
                mostrarStatusDesconhecido();
            }
        }

        // ============================================================
        // INICIAR PROCESSAMENTO
        // ============================================================
        processarPagamento();
    </script>
</body>
</html>
