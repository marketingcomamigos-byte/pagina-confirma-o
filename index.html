<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação - iStart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f7fa;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        .success { color: #2e7d32; }
        .error { color: #c62828; }
        .loading { color: #1a2a6c; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #1a2a6c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover { opacity: 0.9; }
        .btn-success { background: #2e7d32; }
        .btn-gray { background: #6b7280; }
        .btn-gray:hover { background: #4b5563; }
        .btn-whatsapp { background: #25D366; }
        .btn-whatsapp:hover { background: #1da851; }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 8px;
            box-sizing: border-box;
        }
        input[type="email"]:focus {
            border-color: #1a2a6c;
            outline: none;
        }
        .detalhes-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.8rem;
            color: #6b7280;
            text-align: left;
            word-break: break-all;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a2a6c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .mt-8 { margin-top: 8px; }
        .mt-16 { margin-top: 16px; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .gap-8 { gap: 8px; }
        .text-sm { font-size: 0.85rem; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container" id="statusContainer">
        <!-- O JavaScript vai preencher aqui -->
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÕES
        // ============================================================
        const SUPABASE_URL = 'https://rprocjpzydkondrguzui.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcm9janB6eWRrb25kcmd1enVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM2ODA2NjIsImV4cCI6MjA3OTI1NjY2Mn0.bD36ix62EYFdnnTKXN3iK9C9AoOeKyWGkY10D-A1tm0';
        const SISTEMA_URL = 'https://istart-nova.vercel.app';
        const WHATSAPP_NUMERO = '5544997311635';

        // ============================================================
        // PEGAR PARÂMETROS DA URL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const params = {};
        for (const [key, value] of urlParams.entries()) {
            params[key] = value;
        }

        console.log('📥 Parâmetros recebidos:', params);

        const preapprovalId = params.preapproval_id || params.pref_id;
        const status = params.status || params.collection_status;
        const externalReference = params.external_reference;
        const collectionId = params.collection_id || params.payment_id;

        // ============================================================
        // REFERÊNCIA AO CONTAINER
        // ============================================================
        const container = document.getElementById('statusContainer');

        // ============================================================
        // FUNÇÕES DE RENDERIZAÇÃO
        // ============================================================
        function renderizar(icon, titulo, classe, mensagem, botoes, detalhes) {
            container.innerHTML = `
                <div class="icon">${icon}</div>
                <h1 class="${classe}">${titulo}</h1>
                <p style="margin: 8px 0 16px;">${mensagem}</p>
                ${detalhes || ''}
                <div class="flex flex-col gap-8 mt-16">
                    ${botoes || ''}
                </div>
            `;
        }

        function mostrarCarregando() {
            renderizar(
                '⏳',
                'Processando...',
                'loading',
                'Aguarde enquanto ativamos seu premium.',
                '',
                `<div class="spinner"></div>`
            );
        }

        function mostrarSucesso(email) {
            renderizar(
                '🎉',
                'Premium Ativado com Sucesso!',
                'success',
                `Agora você tem acesso a todas as funcionalidades premium do iStart.`,
                `
                    <a href="${SISTEMA_URL}" class="btn btn-success">🚀 Ir para o Sistema</a>
                `,
                `<p class="text-sm">Email: ${email}</p>`
            );
        }

        function mostrarErro(mensagem, email) {
            renderizar(
                '❌',
                'Erro ao ativar premium',
                'error',
                mensagem,
                `
                    <a href="https://wa.me/${WHATSAPP_NUMERO}?text=Olá! Tive um problema ao ativar meu premium. Meu email é: ${email || 'não informado'}" class="btn btn-whatsapp">📱 Falar com Suporte</a>
                    <a href="${SISTEMA_URL}" class="btn btn-gray">Voltar para o Sistema</a>
                `,
                `<div class="detalhes-box"><strong>Parâmetros recebidos:</strong><br>${Object.entries(params).map(([k,v]) => `<strong>${k}:</strong> ${v}`).join('<br>') || 'Nenhum parâmetro'}</div>`
            );
        }

        function mostrarCampoEmail() {
            container.innerHTML = `
                <div class="icon">📧</div>
                <h1 class="loading">Precisamos do seu email</h1>
                <p style="margin: 8px 0 16px;">Para ativar seu premium, informe o email cadastrado no iStart:</p>
                <input type="email" id="emailInput" placeholder="seu@email.com">
                <button onclick="ativarComEmail()" class="btn btn-success mt-8">✅ Ativar Premium</button>
                <p class="text-sm mt-8">Seu email está seguro. Usamos apenas para ativar sua conta.</p>
                <div class="detalhes-box mt-8"><strong>Parâmetros recebidos:</strong><br>${Object.entries(params).map(([k,v]) => `<strong>${k}:</strong> ${v}`).join('<br>') || 'Nenhum parâmetro'}</div>
                <a href="${SISTEMA_URL}" class="btn btn-gray mt-8">Voltar para o Sistema</a>
            `;

            window.ativarComEmail = async function() {
                const emailInput = document.getElementById('emailInput');
                const email = emailInput.value.trim();

                if (!email) {
                    alert('Por favor, digite seu email.');
                    return;
                }

                mostrarCarregando();

                try {
                    const result = await ativarPremium(email);
                    if (result.success) {
                        mostrarSucesso(email);
                    } else {
                        mostrarErro(result.error || 'Erro ao ativar premium.', email);
                    }
                } catch (error) {
                    mostrarErro('Erro ao ativar premium. Entre em contato com o suporte.', email);
                }
            };
        }

        // ============================================================
        // FUNÇÃO PARA ATIVAR PREMIUM
        // ============================================================
        async function ativarPremium(email) {
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/functions/v1/ativar-premium`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: email,
                            preapproval_id: preapprovalId,
                            external_reference: externalReference,
                            collection_id: collectionId
                        })
                    }
                );

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Erro ao ativar premium');
                return result;

            } catch (error) {
                console.error('❌ Erro:', error);
                throw error;
            }
        }

        // ============================================================
        // 🔥 NOVA LÓGICA: ATIVAR PREMIUM SE TIVER preapproval_id
        // ============================================================
        function processarPagamento() {
            // Se não tem parâmetros, mostrar erro
            if (Object.keys(params).length === 0) {
                mostrarErro('Nenhum parâmetro recebido. Você pode ter acessado esta página diretamente.', null);
                return;
            }

            // 🔥 SE TEM preapproval_id, ATIVAR PREMIUM IMEDIATAMENTE
            if (preapprovalId) {
                // Tentar buscar o email
                let email = null;

                // Tenta pegar de várias fontes
                if (params.email) email = params.email;
                else if (externalReference) email = externalReference;
                else if (params.payer_email) email = params.payer_email;

                if (email) {
                    mostrarCarregando();
                    ativarPremium(email)
                        .then(result => {
                            if (result.success) {
                                mostrarSucesso(email);
                            } else {
                                mostrarErro(result.error || 'Erro ao ativar premium. Entre em contato com o suporte.', email);
                            }
                        })
                        .catch(() => {
                            mostrarErro('Erro ao ativar premium. Entre em contato com o suporte.', email);
                        });
                } else {
                    // Se não tem email, pedir ao usuário
                    mostrarCampoEmail();
                }
            } else {
                // Se não tem preapproval_id, mostrar erro
                mostrarErro(
                    'Nenhum ID de assinatura foi encontrado. Entre em contato com o suporte.',
                    null
                );
            }
        }

        // ============================================================
        // INICIAR
        // ============================================================
        mostrarCarregando();
        setTimeout(processarPagamento, 1500);
    </script>
</body>
</html>
